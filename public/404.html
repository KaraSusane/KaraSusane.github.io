<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Pismo w Sprawie</title>
    <script>
      (function () {
        var keepPathSegments = window.location.hostname.endsWith('.github.io') ? 1 : 0;
        var pathSegments = window.location.pathname.split('/');
        var basePath = pathSegments.slice(0, keepPathSegments + 1).join('/');
        var routePath = pathSegments.slice(keepPathSegments + 1).join('/').replace(/&/g, '~and~');
        var search = window.location.search ? '&' + window.location.search.slice(1).replace(/&/g, '~and~') : '';
        var redirectUrl =
          window.location.origin + basePath + '/?/' + routePath + search + window.location.hash;

        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
