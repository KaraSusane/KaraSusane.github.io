<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Profesjonalne pisma, odwołania, wezwania i dokumenty formalne przygotowane do konkretnej sprawy."
    />
    <title>Pismo w Sprawie</title>
    <script>
      (function () {
        if (!window.location.search.startsWith('?/')) {
          return;
        }

        const decodedPath = window.location.search
          .slice(2)
          .split('&')
          .map((segment, index) => (index === 0 ? segment : `?${segment}`))
          .join('')
          .replace(/~and~/g, '&');
        const nextUrl = `${window.location.pathname.replace(/\/$/, '')}/${decodedPath}${window.location.hash}`;

        window.history.replaceState(null, '', nextUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
